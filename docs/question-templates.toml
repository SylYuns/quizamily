# Catalogue des templates de questions Quizamily
#
# Champs obligatoires :
#   id        identifiant stable (ne jamais le modifier une fois en production)
#   category  naissance-enfance | jeunesse | couple-installation | culture-premieres-fois | retraite-voyages-loisirs
#   status    mvp | plus_tard | a_trancher | ecartee
#   text      texte de la question
#   kind      type de réponse (voir ci-dessous)
#
# Champs optionnels :
#   list       nom de la liste de référence (si kind = "list")
#   list_category  catégorie de la liste à proposer (ex : "musique" pour personnalites) ;
#              sans ce champ, toutes les catégories de la liste sont proposées
#   related    personne liée nécessaire (ex : "conjoint")
#   slots      autres éléments à choisir par l'auteur du fait (ex : ["pays"])
#   slot_options (2026-11-25) pour un élément choisi qui n'est pas un pays : liste fermée des
#              choix proposés à l'auteur, chacun avec `label` (affiché dans le choix) et `texte`
#              (inséré dans la question et le récapitulatif, avec son déterminant : « son bac »,
#              « sa licence »). Ex : <diplome>. Jusqu'ici seul <pays> existe côté code : le
#              mécanisme des éléments choisis est à généraliser (même interface : partie de la
#              question soulignée, cliquable).
#   condition  condition sur le sujet pour que la question soit proposée
#   note       remarque libre
#   formes     (2026-11-24) types de réponse entre lesquels l'AUTEUR du fait choisit, le premier
#              étant celui par défaut (= `kind`) ; ex : ["date", "year", "age"]. Sans ce champ :
#              un seul type, `kind`. Le choix est mémorisé sur le fait, et les joueurs répondent
#              avec ce type-là (voir docs/ecrans.md, écran 5, « Forme de la réponse »).
#   text_neutre  (avec `formes`) question formulée sans présumer du type (« Quand… », « Où… »),
#              affichée dans la liste de « Ajouter un souvenir » avant que l'auteur ait choisi ;
#              une fois le type choisi, on affiche le `text` de ce type
#   [template.forme.<type>]  (avec `formes`) `text` et `recap` propres à un type autre que celui
#              par défaut (le type par défaut utilise `text` et `recap` du template)
#   (implicite) l'ORDRE des blocs dans ce fichier fixe `sort_order` en base (1 = premier bloc,
#              N = dernier) : l'ordre narratif du récapitulatif suit cet ordre, pas la date de
#              révélation. Insérer un nouveau template à sa place logique, pas à la fin.
#   recap      phrase de récapitulatif pour la mini-biographie d'une personne (écran 11 de ecrans.md) :
#              {réponse} = valeur formatée, <conjoint>/<pays> = mêmes substitutions que `text`,
#              {Sujet}/{sujet} = pronom "Il"/"il" ou "Elle"/"elle" selon le genre - remplacé par
#              le prénom pour la toute première phrase de la bio (voir src/lib/recap.ts) ; à
#              utiliser en tête de phrase ({Sujet}) quand la phrase porte sur le sujet lui-même.
#              {forme_homme|forme_femme} = accord selon le genre (ex : {né|née}).
#              {réponse_lieu} (2026-11-24) = la réponse précédée de la bonne préposition de lieu :
#              « à Lyon » pour une commune ou une ville, « en Italie », « au Portugal »,
#              « aux États-Unis » pour un pays. Même chose pour <pays_lieu> (élément choisi
#              <pays>), dans `text` comme dans `recap`.
#
# Types de réponse (kind) :
#   date        date complète (sélecteur de date)
#   year        année
#   age         âge en années
#   number      nombre
#   country     pays (liste fixe)
#   city        commune (autocomplétion)
#   place       lieu : l'auteur du fait choisit entre la liste des pays et celle des communes
#   list       liste de référence enrichissable : si l'entrée manque, l'utilisateur l'ajoute ;
#               l'ajout est visible tout de suite dans la famille, et n'entre dans la base globale
#               qu'après validation par nous
#   free_text   saisie libre, réponses des joueurs validées par l'auteur du fait
#
# Listes de référence : animaux, sports, voitures, metiers, films, personnalites
#   Valeurs dans data/listes/ (voir data/listes/LISEZMOI.md).
#   personnalites est découpée en catégories : musique, politique, sport, cinema, television,
#   litterature, arts, sciences.
#
# Accord au féminin (2026-11-18) : `text` utilise la même notation que `recap`,
# {forme_homme|forme_femme} (ex : « a-t-{il|elle} appris », « est-{il|elle} {allé|allée} »),
# remplacée selon le genre de la personne (masculin si inconnu) par src/lib/gender.ts côté app
# et apply_gender_tokens() côté base. Exception assumée : « Où <sujet> et <conjoint> sont-ils
# partis » reste au masculin pluriel.


# ---------- Naissance et enfance ----------

[[template]]
id = "naissance-date"
category = "naissance-enfance"
status = "mvp"
text = "Quelle est la date de naissance de <sujet> ?"
text_neutre = "Quand <sujet> est-{il|elle} {né|née} ?"
kind = "date"
formes = ["date", "year"]
recap = "{Sujet} est {né|née} le {réponse}."

[template.forme.year]
text = "En quelle année <sujet> est-{il|elle} {né|née} ?"
recap = "{Sujet} est {né|née} en {réponse}."

[[template]]
id = "nom-jeune-fille"
category = "naissance-enfance"
status = "mvp"
text = "Quel est le nom de jeune fille de <sujet> ?"
kind = "free_text"
condition = "femme"
recap = "{Sujet} a pour nom de jeune fille {réponse}."

[[template]]
id = "nom-jeune-fille-mere"
category = "naissance-enfance"
status = "mvp"
text = "Quel est le nom de jeune fille de la mère de <sujet> ?"
kind = "free_text"
recap = "Le nom de jeune fille de sa mère était {réponse}."

[[template]]
id = "naissance-adresse"
category = "naissance-enfance"
status = "mvp"
text = "À quelle adresse vivait <sujet> à sa naissance ?"
text_neutre = "Où vivait <sujet> à sa naissance ?"
kind = "free_text"
formes = ["free_text", "city"]
recap = "{Sujet} a vécu, à sa naissance, à {réponse}."

[template.forme.city]
text = "Dans quelle commune vivait <sujet> à sa naissance ?"
recap = "À sa naissance, {sujet} vivait {réponse_lieu}."

[[template]]
id = "naissance-age-aine"
category = "naissance-enfance"
status = "mvp"
text = "Quel âge avait l'aîné de ses frères et sœurs à la naissance de <sujet> ?"
kind = "age"
condition = "a des frères ou sœurs"
note = "la condition ne vérifie que l'existence d'un frère/sœur enregistré, pas l'ordre de naissance (l'auteur du fait connaît la vraie réponse)"
recap = "À sa naissance, l'aîné de ses frères et sœurs avait {réponse} ans."

[[template]]
id = "ecole-age-fin"
category = "naissance-enfance"
status = "mvp"
text = "Jusqu'à quel âge <sujet> est-{il|elle} {allé|allée} à l'école ?"
text_neutre = "Quand <sujet> a-t-{il|elle} quitté l'école ?"
kind = "age"
formes = ["age", "year"]
recap = "{Sujet} a quitté l'école à {réponse} ans."

[template.forme.year]
text = "En quelle année <sujet> a-t-{il|elle} quitté l'école ?"
recap = "{Sujet} a quitté l'école en {réponse}."

[[template]]
id = "enfance-animal"
category = "naissance-enfance"
status = "mvp"
text = "Quel animal de compagnie <sujet> a-t-{il|elle} eu pendant son enfance ?"
kind = "list"
list = "animaux"
note = "la liste doit contenir « aucun »"
recap = "{Sujet} a eu {réponse} comme animal de compagnie pendant son enfance."

[[template]]
id = "cadeau-bapteme-communion"
category = "naissance-enfance"
status = "a_trancher"
text = "Quel cadeau <sujet> a-t-{il|elle} reçu pour <ceremonie> ?"
kind = "free_text"
slots = ["ceremonie"]
slot_options.ceremonie = [
  { label = "Baptême", texte = "son baptême" },
  { label = "Communion", texte = "sa communion" },
]
recap = "Pour <ceremonie>, {sujet} a reçu {réponse}."
note = "idée de Sylvain (2026-11-25). À TRANCHER : une question sur un baptême ou une communion peut révéler les convictions religieuses d'une personne, donnée sensible au sens de l'article 9 du RGPD (voir docs/rgpd.md, point 3) — à valider avec le juriste avant de la proposer, ou à reformuler autour d'une occasion non religieuse."


