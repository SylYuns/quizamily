# Catalogue des templates de questions Quizamily
#
# Champs obligatoires :
#   id        identifiant stable (ne jamais le modifier une fois en production)
#   category  naissance-enfance | jeunesse | couple-installation | culture-premieres-fois | retraite-voyages-loisirs
#   status    mvp | plus_tard | a_trancher | ecartee
#   text      texte de la question
#   kind      type de réponse (voir ci-dessous)
#
# Champs optionnels :
#   list       nom de la liste de référence (si kind = "list")
#   related    personne liée nécessaire (ex : "conjoint")
#   slots      autres éléments à choisir par l'auteur du fait (ex : ["pays"])
#   condition  condition sur le sujet pour que la question soit proposée
#   note       remarque libre
#   (implicite) l'ORDRE des blocs dans ce fichier fixe `sort_order` en base (1 = premier bloc,
#              32 = dernier) : l'ordre narratif du récapitulatif suit cet ordre, pas la date de
#              révélation. Insérer un nouveau template à sa place logique, pas à la fin.
#   recap      phrase de récapitulatif pour la mini-biographie d'une personne (écran 11 de ecrans.md) :
#              {réponse} = valeur formatée, <conjoint>/<pays> = mêmes substitutions que `text`,
#              {Sujet}/{sujet} = pronom "Il"/"il" ou "Elle"/"elle" selon le genre - remplacé par
#              le prénom pour la toute première phrase de la bio (voir src/lib/recap.ts) ; à
#              utiliser en tête de phrase ({Sujet}) quand la phrase porte sur le sujet lui-même.
#              {forme_homme|forme_femme} = accord selon le genre (ex : {né|née}).
#
# Types de réponse (kind) :
#   date        date complète (sélecteur de date)
#   year        année
#   age         âge en années
#   number      nombre
#   country     pays (liste fixe)
#   city        commune (autocomplétion)
#   place       lieu : l'auteur du fait choisit entre la liste des pays et celle des communes
#   list       liste de référence enrichissable : si l'entrée manque, l'utilisateur l'ajoute ;
#               l'ajout est visible tout de suite dans la famille, et n'entre dans la base globale
#               qu'après validation par nous
#   free_text   saisie libre, réponses des joueurs validées par l'auteur du fait
#
# Listes de référence : animaux, sports, voitures, metiers, films, personnalites
#
# Les textes de question (`text`) sont écrits au masculin. L'accord au féminin selon le sujet
# (« est-il allé » → « est-elle allée ») n'est pas géré pour `text` (reste à trancher, voir
# roadmap.md) ; `recap` a sa propre solution ({forme_homme|forme_femme}), indépendante.


# ---------- Naissance et enfance ----------

[[template]]
id = "naissance-date"
category = "naissance-enfance"
status = "mvp"
text = "Quelle est la date de naissance de <sujet> ?"
kind = "date"
recap = "{Sujet} est {né|née} le {réponse}."

[[template]]
id = "nom-jeune-fille"
category = "naissance-enfance"
status = "mvp"
text = "Quel est le nom de jeune fille de <sujet> ?"
kind = "free_text"
condition = "femme"
recap = "{Sujet} a pour nom de jeune fille {réponse}."

[[template]]
id = "nom-jeune-fille-mere"
category = "naissance-enfance"
status = "mvp"
text = "Quel est le nom de jeune fille de la mère de <sujet> ?"
kind = "free_text"
recap = "Le nom de jeune fille de sa mère était {réponse}."

[[template]]
id = "naissance-adresse"
category = "naissance-enfance"
status = "mvp"
text = "À quelle adresse vivait <sujet> à sa naissance ?"
kind = "free_text"
recap = "{Sujet} a vécu, à sa naissance, à {réponse}."

[[template]]
id = "naissance-age-aine"
category = "naissance-enfance"
status = "mvp"
text = "Quel âge avait l'aîné de ses frères et sœurs à la naissance de <sujet> ?"
kind = "age"
condition = "a des frères ou sœurs"
note = "la condition ne vérifie que l'existence d'un frère/sœur enregistré, pas l'ordre de naissance (l'auteur du fait connaît la vraie réponse)"
recap = "À sa naissance, l'aîné de ses frères et sœurs avait {réponse} ans."

[[template]]
id = "ecole-age-fin"
category = "naissance-enfance"
status = "mvp"
text = "Jusqu'à quel âge <sujet> est-il allé à l'école ?"
kind = "age"
recap = "{Sujet} a quitté l'école à {réponse} ans."

[[template]]
id = "enfance-animal"
category = "naissance-enfance"
status = "mvp"
text = "Quel animal de compagnie <sujet> a-t-il eu pendant son enfance ?"
kind = "list"
list = "animaux"
note = "la liste doit contenir « aucun »"
recap = "{Sujet} a eu {réponse} comme animal de compagnie pendant son enfance."


