<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rejoindre – piste B, trouve ta place dans l'arbre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Piste B « Trouve ta place » : on montre l'arbre de la famille ; les profils pas encore pris sont en pointillés, on se choisit en touchant son rond. -->
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #FFC98A 0%, #FFA36B 46%, #F48A86 100%); font-family: Nunito, system-ui, sans-serif; color: #3B1F14; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; padding: 40px 20px 0">
    <span style="position: relative; display: flex; flex-shrink: 0; padding: 3px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 rgba(138,58,18,0.22)">
      <dc-import name="Logo" animal="vache" taille="{{ 54 }}" hint-size="54px,54px"></dc-import>
      <span style="position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); padding: 0 6px; border-radius: 8px; border: 2px solid #FFFFFF; background: #3B1F14; color: #FFFFFF; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 11px; line-height: 15px; letter-spacing: 0.04em">CH</span>
    </span>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 800; color: #5E2A12">Sylvain t’invite dans la</span>
      <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 28px; line-height: 1.05">Famille Chardaire</span>
    </span>
  </header>

  <sc-if value="{{isChoix}}" hint-placeholder-val="{{ false }}">
    <p style="position: absolute; left: 20px; right: 20px; top: 118px; margin: 0; padding: 10px 14px; border-radius: 16px; background: rgba(255,244,232,0.7); font-size: 16px; font-weight: 800; text-align: center">Où es-tu ? Touche ton rond.</p>
  </sc-if>

  <svg width="390" height="420" viewBox="0 0 390 420" aria-hidden="true" style="position: absolute; left: 0; top: 160px">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
      <path d="{{l}}" fill="none" stroke="rgba(138,58,18,0.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    </sc-for>
  </svg>
  <sc-for list="{{people}}" as="p" hint-placeholder-count="10">
    <span style="{{p.wrap}}">
      <span style="{{p.rond}}">{{p.letter}}
        <sc-if value="{{p.star}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; right: -5px; bottom: -5px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #FFFFFF; background: #8A3A12; color: #FFD66B; box-sizing: border-box"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"></path></svg></span>
        </sc-if>
      </span>
      <span style="{{p.label}}">{{p.name}}</span>
    </span>
  </sc-for>

  <sc-if value="{{isInvite}}" hint-placeholder-val="{{ true }}">
    <section style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 22px 30px; border-radius: 30px 30px 0 0; background: #FFF4E8; box-shadow: 0 -8px 30px rgba(59,31,20,0.18)">
      <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #E6D2B8"></span>
      <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 21px">11 personnes, 24 souvenirs… il ne manque plus que toi !</span>
      <input type="email" placeholder="Ton adresse e-mail" style="box-sizing: border-box; height: 52px; padding: 0 16px; border: 2px solid #EAD9BD; border-radius: 16px; background: #FFFFFF; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 700; color: #3B1F14">
      <button type="button" style="min-height: 54px; border: none; border-radius: 27px; background: #8A3A12; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #5E260B">Recevoir mon lien pour entrer</button>
    </section>
  </sc-if>

  <sc-if value="{{isChoix}}" hint-placeholder-val="{{ false }}">
    <section style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 22px 26px; border-radius: 30px 30px 0 0; background: #FFF4E8; box-shadow: 0 -8px 30px rgba(59,31,20,0.18)">
      <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #E6D2B8"></span>
      <span style="display: flex; align-items: center; gap: 12px">
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; box-sizing: border-box; border: 3px solid #FFFFFF; border-radius: 24px; background: #9FD3C7; color: #134A40; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px; box-shadow: 0 0 0 3px #8A3A12">B</span>
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 18px; font-weight: 800">Bernard Chardaire</span>
          <span style="font-size: 14px; font-weight: 700; color: #6E4A3A">Fils de Marie et Jean</span>
        </span>
      </span>
      <button type="button" style="min-height: 54px; border: none; border-radius: 27px; background: #8A3A12; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #5E260B">Oui, c’est moi</button>
      <button type="button" style="min-height: 40px; border: none; background: transparent; color: #3B1F14; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; text-decoration: underline; cursor: pointer">Je ne suis pas dans l’arbre</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etape":{"editor":"enum","default":"invite","options":["invite","choix"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const choix = this.props.etape === 'choix';
    const colors = { jaune: ['#FFD66B', '#5A3A00'], menthe: ['#9FD3C7', '#134A40'], orange: ['#F7A06A', '#4A1E06'], lavande: ['#B9A3E3', '#2E1A5C'] };
    const top = 160;
    // [lettre, prénom, couleur, x, y (dans l'arbre), taille, étoile, libre (profil pas encore pris), choisi]
    const list = [
      ['M', 'Marie', 'jaune', 150, 40, 64, true, false, false], ['J', 'Jean', 'menthe', 240, 40, 64, true, false, false],
      ['O', 'Odette', 'orange', 60, 165, 54, false, true, false], ['A', 'André', 'lavande', 128, 165, 54, false, true, false],
      ['P', 'Pierre', 'orange', 222, 165, 54, false, false, false], ['B', 'Bernard', 'menthe', 330, 165, 54, false, true, true],
      ['C', 'Chloé', 'lavande', 60, 295, 46, false, false, false], ['T', 'Théo', 'jaune', 128, 295, 46, false, true, false],
      ['S', 'Sylvain', 'menthe', 222, 295, 46, false, false, false], ['E', 'Emma', 'jaune', 282, 295, 46, false, false, false],
    ];
    const people = list.map(([letter, name, c, x, y, size, star, free, sel]) => {
      const highlightFree = choix && free;
      const isSel = choix && sel;
      const base = 'position: relative; display: flex; align-items: center; justify-content: center; width: ' + size + 'px; height: ' + size + 'px; box-sizing: border-box; border-radius: 50%; font-family: Fredoka, sans-serif; font-weight: 600; font-size: ' + Math.round(size * 0.42) + 'px; ';
      let rond;
      if (isSel) rond = base + 'border: 3px solid #FFFFFF; background: ' + colors[c][0] + '; color: ' + colors[c][1] + '; box-shadow: 0 0 0 4px #8A3A12, 0 6px 0 4px rgba(94,38,11,0.35)';
      else if (highlightFree) rond = base + 'border: 3px dashed #8A3A12; background: #FFF4E8; color: #8A3A12';
      else rond = base + 'border: 3px solid #FFFFFF; background: ' + colors[c][0] + '; color: ' + colors[c][1] + '; box-shadow: 0 3px 0 rgba(138,58,18,0.2)' + (choix ? '; opacity: 0.5' : '');
      return {
        letter, name, star,
        wrap: 'position: absolute; left: ' + (x - 40) + 'px; top: ' + (top + y - size / 2) + 'px; width: 80px; display: flex; flex-direction: column; align-items: center; gap: 4px',
        rond,
        label: 'font-size: 13px; font-weight: 800; color: ' + (isSel ? '#3B1F14' : '#5E2A12') + (choix && !free ? '; opacity: 0.5' : ''),
      };
    });
    return {
      isInvite: !choix,
      isChoix: choix,
      people,
      lines: [
        'M150 40 H240 M195 40 V110 M60 110 H330 M60 110 V138 M222 110 V138 M330 110 V138',
        'M60 165 H128',
        'M94 165 V240 M60 240 H128 M60 240 V272 M128 240 V272',
        'M222 212 V240 M222 240 H282 M222 240 V272 M282 240 V272',
      ],
    };
  }
}
</script>
</body>
</html>
