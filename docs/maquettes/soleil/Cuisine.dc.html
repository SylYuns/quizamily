<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cuisine de mamie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Quicksand:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#A84A24}a:hover{color:#7E3A1C}
.vichy{background-image:linear-gradient(90deg, rgba(168,74,36,0.07) 50%, transparent 50%),linear-gradient(rgba(168,74,36,0.07) 50%, transparent 50%);background-size:28px 28px}
.liteaux{background-image:linear-gradient(180deg, transparent 0 3px, #2F5AA8 3px 7px, transparent 7px 10px, #C8423A 10px 12px, transparent 12px 15px, #2F5AA8 15px 19px, transparent 19px 22px)}
</style>
</helmet>
<div class="vichy" style="width: 390px; height: 844px; box-sizing: border-box; background-color: #FBF3E4; font-family: Quicksand, system-ui, sans-serif; font-weight: 600; color: #4A2E1F; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #F4E6CC">
    <header style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 2px solid #E3CCA6; border-radius: 24px; background: #FFFDF8; font-family: Sniglet, Quicksand, sans-serif; font-weight: 800; font-size: 18px; color: #4A2E1F; cursor: pointer">
        Famille Chardaire
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button type="button" aria-label="Inviter dans la famille" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: none; border-radius: 22px; background: #A84A24; color: #FFFFFF; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"></path><circle cx="8.5" cy="7" r="3.5"></circle><path d="M19 8v6M22 11h-6"></path></svg>
      </button>
      <div style="flex-grow: 1"></div>
      <button type="button" aria-label="Menu" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #4A2E1F; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </header>
    <div class="liteaux" aria-hidden="true" style="height: 22px; background-color: #F4E6CC"></div>
  </div>

  <main style="display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 16px">
    <p style="display: flex; align-items: center; gap: 8px; margin: 0; font-family: Sniglet, Quicksand, sans-serif; font-weight: 800; font-size: 26px; color: #4A2E1F">Bonjour Sylvain
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#C8423A" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 5.4 3.2C13.8 6.2 15.3 5 17.4 5 21 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z"></path></svg>
    </p>

    <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
      <button type="button" style="display: flex; box-sizing: border-box; padding: 7px; border: none; border-radius: 30px; background: #A84A24; color: #FFFFFF; text-align: left; cursor: pointer; box-shadow: 0 8px 20px rgba(122,52,22,0.28)">
        <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; width: 100%; box-sizing: border-box; padding: 18px 18px 20px; border: 2px dashed rgba(255,233,199,0.6); border-radius: 24px">
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 28px">
            <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #FFE9C7">Participer au quiz</span>
            <span style="min-width: 30px; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 15px; background: #F2B33D; color: #4A2A12; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">1</span>
          </span>
          <span style="font-family: Sniglet, Quicksand, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05">Une question t’attend</span>
          <span style="font-size: 15px; color: #FFE9C7">À répondre avant dimanche 22 novembre</span>
        </span>
      </button>
    </sc-if>
    <sc-if value="{{isWaiting}}" hint-placeholder-val="{{ false }}">
      <button type="button" style="display: flex; flex-direction: column; box-sizing: border-box; padding: 0; border: 2px solid #EAD9BD; border-radius: 30px; background: #FFFDF8; color: #4A2E1F; text-align: left; cursor: pointer; overflow: hidden; box-shadow: 0 6px 16px rgba(122,52,22,0.12)">
        <span class="liteaux" aria-hidden="true" style="display: block; height: 22px; background-color: #F4E6CC"></span>
        <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 22px 20px">
          <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #A84A24">Participer au quiz</span>
          <span style="font-family: Sniglet, Quicksand, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05">Réponse envoyée</span>
          <span style="font-size: 15px; color: #7A4E36">Révélation dimanche 22 novembre</span>
          <span style="display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: #A84A24">Voir ou modifier ma réponse
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </span>
        </span>
      </button>
    </sc-if>

    <button type="button" style="display: flex; box-sizing: border-box; padding: 6px; border: none; border-radius: 30px; background: #DCE6D2; color: #2F4A2A; text-align: left; cursor: pointer; box-shadow: 0 6px 16px rgba(47,74,42,0.14)">
      <span style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 92px; box-sizing: border-box; padding: 12px 14px; border: 2px dashed rgba(47,74,42,0.35); border-radius: 24px">
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 56px; height: 56px; border-radius: 28px; background: #FFFDF8; color: #2F4A2A">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-7"></path><path d="M12 14c-4.4 0-7-2.4-7-5.6C5 5.4 8.1 3 12 3s7 2.4 7 5.4c0 3.2-2.6 5.6-7 5.6z"></path><path d="M9 21h6"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: Sniglet, Quicksand, sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1">Consulter les connaissances</span>
          <span style="font-size: 15px">24 souvenirs sur 4 personnes</span>
        </span>
      </span>
    </button>

    <div style="display: flex; flex-direction: column; border-radius: 28px; background: #F6D58A; overflow: hidden; box-shadow: 0 6px 16px rgba(122,52,22,0.14)">
      <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 68px; box-sizing: border-box; padding: 12px 18px; border: none; background: transparent; color: #4A2E1F; text-align: left; cursor: pointer">
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; background: #A84A24; color: #FFFFFF">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
        <span style="font-family: Sniglet, Quicksand, sans-serif; font-weight: 800; font-size: 21px">Ajouter un souvenir</span>
      </button>
      <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: #FDE3D3; color: #A33A2A; font-size: 14px; font-weight: 700">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
          Plus que 3 questions en réserve
        </div>
      </sc-if>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 62px; box-sizing: border-box; padding: 10px 16px; border: 2px solid #EAD9BD; border-radius: 22px; background: #FFFDF8; color: #4A2E1F; font-family: Quicksand, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A84A24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        Historique
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 62px; box-sizing: border-box; padding: 10px 16px; border: 2px solid #EAD9BD; border-radius: 22px; background: #FFFDF8; color: #4A2E1F; font-family: Quicksand, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A84A24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
        Mes faits
        <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
          <span style="margin-left: auto; min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 7px; border-radius: 12px; background: #C8423A; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
        </sc-if>
      </button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","default":"question","options":["question","repondu"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const etat = this.props.etat ?? 'question';
    return { isQuestion: etat === 'question', isWaiting: etat === 'repondu' };
  }
}
</script>
</body>
</html>
