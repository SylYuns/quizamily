<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil – emblème de la famille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#8A3A12}a:hover{color:#5E260B}
.tuile-lien::after{content:"";position:absolute;inset:0;z-index:1;border-radius:32px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #FFC98A 0%, #FFA36B 42%, #F48A86 100%); font-family: Nunito, system-ui, sans-serif; color: #3B1F14; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px 20px">
    <h1 style="flex: 1; min-width: 0; margin: 0; font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 28px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Famille Chardaire</h1>
    <dc-import name="Embleme" variante="dessus" animal="vache" lettres="CH" lisere="{{ false }}" hint-size="52px,60px"></dc-import>
  </header>

  <main style="display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 16px">
    <p style="margin: 0; font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 22px; color: #5E2A12">Bonjour Sylvain</p>

    <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
      <button type="button" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; box-sizing: border-box; padding: 24px 22px; border: none; border-radius: 32px; background: #8A3A12; color: #FFFFFF; text-align: left; cursor: pointer; overflow: hidden; box-shadow: 0 7px 0 #5E260B">
        <span aria-hidden="true" style="position: absolute; top: -46px; right: -40px; width: 150px; height: 150px; border-radius: 75px; background: #FFD66B; opacity: 0.22"></span>
        <span aria-hidden="true" style="position: absolute; top: -12px; right: -6px; width: 82px; height: 82px; border-radius: 41px; background: #FFD66B; opacity: 0.35"></span>
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 28px">
          <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #FFE3CF">Participer au quiz</span>
          <span style="position: relative; min-width: 30px; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 15px; background: #FFD66B; color: #3B1F14; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center">1</span>
        </span>
        <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 31px; line-height: 1.05">Une question t’attend</span>
        <span style="font-size: 15px; color: #FFE3CF">À répondre avant dimanche 22 novembre</span>
      </button>
    </sc-if>
    <sc-if value="{{isWaiting}}" hint-placeholder-val="{{ false }}">
      <button type="button" style="position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; box-sizing: border-box; padding: 24px 22px; border: none; border-radius: 32px; background: #5B2333; color: #FFFFFF; text-align: left; cursor: pointer; overflow: hidden; box-shadow: 0 7px 0 #3D1622">
        <span aria-hidden="true" style="position: absolute; top: 14px; right: 26px; width: 46px; height: 46px; border-radius: 23px; background: #FFD66B; opacity: 0.9"></span>
        <span aria-hidden="true" style="position: absolute; top: 8px; right: 14px; width: 46px; height: 46px; border-radius: 23px; background: #5B2333"></span>
        <span aria-hidden="true" style="position: absolute; top: 58px; right: 70px; width: 5px; height: 5px; border-radius: 3px; background: #FFE3CF"></span>
        <span aria-hidden="true" style="position: absolute; top: 24px; right: 88px; width: 4px; height: 4px; border-radius: 2px; background: #FFE3CF"></span>
        <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #FFD9C2">Participer au quiz</span>
        <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 31px; line-height: 1.05">Réponse envoyée</span>
        <span style="font-size: 15px; color: #FFD9C2">Révélation dimanche 22 novembre</span>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 800; color: #FFD66B">Voir ou modifier ma réponse
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </span>
      </button>
    </sc-if>

    <sc-if value="{{discussion}}" hint-placeholder-val="{{ false }}">
      <!-- Signal de nouveaux commentaires (2026-11-25) : seulement s'il y a du nouveau depuis ma dernière lecture.
           Sur une seule réponse : « 3 nouveaux commentaires » → la révélation de cette question, à la discussion.
           Sur plusieurs : « 5 nouveaux commentaires sur 2 réponses » → l'Historique filtré sur « Nouveaux commentaires ». -->
      <button type="button" style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 60px; padding: 8px 14px 8px 10px; border: 2px solid #FFFFFF; border-radius: 24px; background: #FFF4E8; color: #3B1F14; text-align: left; cursor: pointer; font-family: Nunito, sans-serif; box-shadow: 0 4px 0 rgba(138,58,18,0.18)">
        <span style="position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; background: #8A3A12; color: #FFD66B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path></svg>
          <span style="position: absolute; top: -5px; right: -6px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; border: 2px solid #FFF4E8; background: #C8423A; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{discussionCount}}</span>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 16px; font-weight: 800">Ça discute&nbsp;!</span>
          <span style="font-size: 13px; font-weight: 700; color: #6E4A3A">{{discussionText}}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A3A12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-if>

    <section style="position: relative; display: flex; align-items: center; gap: 18px; box-sizing: border-box; padding: 16px 18px; border-radius: 32px; background: #FFD9DC; box-shadow: 0 7px 0 rgba(138,58,18,0.22)">
      <div style="position: relative; z-index: 2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; flex-shrink: 0">
        <button type="button" aria-label="Voir Odette dans l’arbre" title="Odette" style="position: relative; display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; padding: 0; border: 3px solid #FFFFFF; border-radius: 29px; background: #F7A06A; color: #4A1E06; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px; box-sizing: border-box; cursor: pointer; box-shadow: 0 3px 0 rgba(138,58,18,0.18)">O</button>
        <button type="button" aria-label="Voir Lucien dans l’arbre" title="Lucien" style="position: relative; display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; padding: 0; border: 3px solid #FFFFFF; border-radius: 29px; background: #B9A3E3; color: #2E1A5C; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px; box-sizing: border-box; cursor: pointer; box-shadow: 0 3px 0 rgba(138,58,18,0.18)">L</button>
        <button type="button" aria-label="Voir Mamie Marie dans l’arbre" title="Mamie Marie" style="position: relative; display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; padding: 0; border: 3px solid #FFFFFF; border-radius: 29px; background: #FFD66B; color: #5A3A00; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px; box-sizing: border-box; cursor: pointer; box-shadow: 0 3px 0 rgba(138,58,18,0.18)">M<span style="position: absolute; right: -5px; bottom: -5px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #FFFFFF; background: #8A3A12; color: #FFD66B; box-sizing: border-box"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"></path></svg></span></button>
        <button type="button" aria-label="Voir Papi Jean dans l’arbre" title="Papi Jean" style="position: relative; display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; padding: 0; border: 3px solid #FFFFFF; border-radius: 29px; background: #9FD3C7; color: #134A40; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px; box-sizing: border-box; cursor: pointer; box-shadow: 0 3px 0 rgba(138,58,18,0.18)">J<span style="position: absolute; right: -5px; bottom: -5px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #FFFFFF; background: #8A3A12; color: #FFD66B; box-sizing: border-box"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"></path></svg></span></button>
      </div>
      <a href="#" class="tuile-lien" style="display: flex; flex-direction: column; gap: 4px; color: #3B1F14; text-decoration: none">
        <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 25px; line-height: 1.1">Consulter les connaissances</span>
        <span style="font-size: 16px; line-height: 1.3; color: #6E3A3A">24 souvenirs sur 4 personnes</span>
      </a>
    </section>

    <div style="display: flex; flex-direction: column; border-radius: 28px; background: #FFD66B; overflow: hidden; box-shadow: 0 6px 0 rgba(138,58,18,0.22)">
      <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 66px; box-sizing: border-box; padding: 11px 18px; border: none; background: transparent; color: #3B1F14; text-align: left; cursor: pointer">
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; background: #8A3A12; color: #FFFFFF">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
        <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 21px">Ajouter un souvenir</span>
      </button>
      <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: #FDE3D3; color: #A33A2A; font-size: 14px; font-weight: 800">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
          Plus que 3 questions en réserve
        </div>
      </sc-if>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 60px; box-sizing: border-box; padding: 10px 16px; border: 2px solid rgba(255,255,255,0.7); border-radius: 24px; background: rgba(255,244,232,0.5); color: #3B1F14; font-family: Nunito, sans-serif; font-weight: 800; font-size: 16px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        Historique
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 60px; box-sizing: border-box; padding: 10px 16px; border: 2px solid rgba(255,255,255,0.7); border-radius: 24px; background: rgba(255,244,232,0.5); color: #3B1F14; font-family: Nunito, sans-serif; font-weight: 800; font-size: 16px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
        Mes faits
        <sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}">
          <span style="margin-left: auto; min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 7px; border-radius: 12px; background: #C8423A; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
        </sc-if>
      </button>
    </div>

    <!-- Bilan du mois (2026-11-25) : bouton pleine largeur, plus vivant que Historique / Mes faits : le podium en miniature et une phrase qui félicite. -->
    <button type="button" style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 70px; padding: 10px 14px 10px 12px; border: 2px solid #FFFFFF; border-radius: 26px; background: linear-gradient(90deg, #FFF4E8 0%, #FFE9A8 100%); color: #3B1F14; text-align: left; cursor: pointer; font-family: Nunito, sans-serif; box-shadow: 0 5px 0 rgba(138,58,18,0.2)">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; background: #8A3A12">
        <svg width="26" height="18" viewBox="0 0 30 20" aria-hidden="true"><path d="M3 18 L1 4 L9 10 L15 1 L21 10 L29 4 L27 18 Z" fill="#FFD66B" stroke="#FFD66B" stroke-width="1.5" stroke-linejoin="round"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; min-width: 0">
        <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 18px; white-space: nowrap">Bilan de novembre</span>
        <span style="font-size: 13px; font-weight: 700; color: #6E4A3A">Lucien mène la danse</span>
      </span>
      <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; box-sizing: border-box; border: 2px solid #FFFFFF; border-radius: 12px; background: #F7A06A; color: #4A1E06; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 11px">O</span><span style="width: 24px; height: 14px; border-radius: 4px 4px 0 0; background: #8A3A12"></span></span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; box-sizing: border-box; border: 2px solid #FFFFFF; border-radius: 14px; background: #B9A3E3; color: #2E1A5C; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 12px">L</span><span style="width: 28px; height: 22px; border-radius: 4px 4px 0 0; background: #8A3A12"></span></span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; box-sizing: border-box; border: 2px solid #FFFFFF; border-radius: 12px; background: #9FD3C7; color: #134A40; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 11px">B</span><span style="width: 24px; height: 9px; border-radius: 4px 4px 0 0; background: #8A3A12"></span></span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A3A12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </main>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 8; background: rgba(59,31,20,0.35)"></div>
    <section aria-label="Menu de la famille" style="position: absolute; top: 86px; right: 12px; z-index: 9; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 26px; background: #FFF4E8; box-shadow: 0 8px 0 rgba(138,58,18,0.25), 0 18px 40px rgba(59,31,20,0.25); overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px">
        <dc-import name="Logo" animal="vache" taille="{{ 56 }}" hint-size="56px,56px"></dc-import>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 21px">Famille Chardaire</span>
          <a href="#" style="font-size: 13px; font-weight: 800; color: #8A3A12">Personnaliser l’emblème</a>
        </span>
      </div>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 48px; margin: 0 12px 10px; padding: 0 14px; border: none; border-radius: 16px; background: #8A3A12; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #5E260B">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"></path><circle cx="8.5" cy="7" r="3.5"></circle><path d="M19 8v6M22 11h-6"></path></svg>
        Inviter dans la famille
      </button>
      <span style="padding: 8px 16px 4px; border-top: 2px solid #F1E4D2; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #6E4A3A">Mes familles</span>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 16px; border: none; background: #FFE1C2; text-align: left; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; color: #3B1F14; cursor: pointer">
        <dc-import name="Logo" animal="vache" taille="{{ 34 }}" hint-size="34px,34px"></dc-import>
        <span style="flex: 1">Chardaire</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A3A12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 16px; border: none; background: transparent; text-align: left; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 700; color: #3B1F14; cursor: pointer">
        <dc-import name="Logo" animal="lezard" taille="{{ 34 }}" hint-size="34px,34px"></dc-import>
        <span style="flex: 1">Delatour</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 16px 8px; border: none; background: transparent; text-align: left; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; color: #8A3A12; cursor: pointer">
        <span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; box-sizing: border-box; border-radius: 17px; border: 2px dashed #8A3A12">+</span>
        Créer une autre famille
      </button>
      <div style="display: flex; flex-direction: column; border-top: 2px solid #F1E4D2">
        <button type="button" style="min-height: 44px; padding: 0 16px; border: none; background: transparent; text-align: left; font-family: Nunito, sans-serif; font-size: 14px; font-weight: 700; color: #6E4A3A; cursor: pointer">Créer une session maintenant (test)</button>
        <button type="button" style="min-height: 44px; padding: 0 16px; border: none; background: transparent; text-align: left; font-family: Nunito, sans-serif; font-size: 14px; font-weight: 700; color: #6E4A3A; cursor: pointer">Se déconnecter</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","default":"question","options":["question","repondu"]},"menu":{"editor":"boolean","default":false},"discussion":{"editor":"enum","default":"","options":["","une","plusieurs"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const etat = this.props.etat ?? 'question';
    const raw = this.props.discussion;
    const d = raw === true || raw === 'true' || raw === 'une' ? 'une' : raw === 'plusieurs' ? 'plusieurs' : '';
    return { isQuestion: etat === 'question', isWaiting: etat === 'repondu', menuOpen: this.props.menu === true || this.props.menu === 'true', discussion: !!d, discussionCount: d === 'plusieurs' ? '5' : '3', discussionText: d === 'plusieurs' ? '5 nouveaux commentaires sur 2 réponses' : '3 nouveaux commentaires' };
  }
}
</script>
</body>
</html>
