<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choix de famille à l'arrivée</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Choix de famille à la connexion (écran 3), piste A retenue le 2026-11-24 : une carte par famille, teintée de la couleur de son emblème.
     Dans la carte : les actions (code couleur de l'accueil : brun + soleil = à faire, prune + lune = on attend), puis les alertes (bandeau rose-orangé).
     Toucher une ligne = aller directement à l'action ; toucher le reste de la carte (en-tête) = accueil de la famille. -->
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #FFC98A 0%, #FFA36B 46%, #F48A86 100%); font-family: Nunito, system-ui, sans-serif; color: #3B1F14; display: flex; flex-direction: column; gap: 14px; padding: 48px 16px 24px; overflow: hidden">

  <div style="display: flex; align-items: flex-start; gap: 10px; padding: 0 0 4px 6px">
    <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <h1 style="margin: 0; font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 30px">Bonjour Sylvain</h1>
      <p style="margin: 0; font-size: 16px; font-weight: 700; color: #5E2A12">Du nouveau dans tes familles.</p>
    </span>
    <button type="button" aria-label="Menu" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; border: none; border-radius: 24px; background: #FFFFFF; cursor: pointer; box-shadow: 0 3px 0 rgba(138,58,18,0.2)">
      <svg width="24" height="22" viewBox="0 0 24 22" aria-hidden="true"><rect x="2" y="2" width="20" height="4" rx="2" fill="#2F5AA8"></rect><rect x="2.75" y="9.75" width="18.5" height="2.5" rx="1.25" fill="#FFFFFF" stroke="#C9B9A8" stroke-width="1.5"></rect><rect x="2" y="16" width="20" height="4" rx="2" fill="#C8423A"></rect></svg>
    </button>
  </div>

  <sc-for list="{{families}}" as="f" hint-placeholder-count="3">
    <section style="{{f.card}}">
      <button type="button" aria-label="{{f.openLabel}}" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 0 2px 0 0; border: none; background: transparent; color: #3B1F14; text-align: left; cursor: pointer; font-family: Nunito, sans-serif">
        <span style="position: relative; display: flex; flex-shrink: 0; padding: 3px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 rgba(59,31,20,0.15)">
          <dc-import name="Logo" animal="{{f.animal}}" couleur="{{f.couleur}}" taille="{{ 50 }}" hint-size="50px,50px"></dc-import>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
          <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 23px; line-height: 1.05">{{f.name}}</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{f.dark}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <sc-for list="{{f.rows}}" as="r" hint-placeholder-count="2">
        <button type="button" style="{{r.style}}">
          <sc-if value="{{r.isAction}}" hint-placeholder-val="{{ true }}">
            <span aria-hidden="true" style="position: relative; flex-shrink: 0; width: 30px; height: 30px; border-radius: 15px; background: #FFD66B; box-shadow: 0 0 0 4px rgba(255,214,107,0.3)"></span>
          </sc-if>
          <sc-if value="{{r.isWait}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: relative; flex-shrink: 0; width: 30px; height: 30px; overflow: hidden">
              <span style="position: absolute; left: 2px; top: 3px; width: 24px; height: 24px; border-radius: 12px; background: #FFD66B"></span>
              <span style="position: absolute; left: 9px; top: -1px; width: 24px; height: 24px; border-radius: 12px; background: #5B2333"></span>
            </span>
          </sc-if>
          <sc-if value="{{r.isAlert}}" hint-placeholder-val="{{ false }}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A33A2A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin: 0 3px"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
          </sc-if>
          <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; text-align: left">
            <span style="{{r.titleStyle}}">{{r.title}}</span>
            <span style="{{r.subStyle}}">{{r.sub}}</span>
          </span>
          <sc-if value="{{r.arrow}}" hint-placeholder-val="{{ true }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </section>
  </sc-for>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <span aria-hidden="true" style="position: absolute; inset: 0; z-index: 8; background: rgba(59,31,20,0.25)"></span>
    <section aria-label="Menu" style="position: absolute; top: 104px; right: 14px; z-index: 9; width: 270px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 26px; background: #FFF4E8; box-shadow: 0 8px 0 rgba(138,58,18,0.25), 0 18px 40px rgba(59,31,20,0.25); overflow: hidden">
      <span style="display: flex; align-items: center; gap: 12px; padding: 16px 18px 14px; border-bottom: 2px solid #F0E0CC">
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border: 3px solid #FFFFFF; border-radius: 22px; background: #F7A06A; color: #4A1E06; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 19px; box-shadow: 0 3px 0 rgba(138,58,18,0.18)">S</span>
        <span style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-size: 17px; font-weight: 800">Sylvain Chardaire</span>
          <span style="font-size: 13px; font-weight: 700; color: #6E4A3A">sylvain@exemple.fr</span>
        </span>
      </span>
      <button type="button" style="{{menuItem}}">+ Créer une autre famille</button>
      <button type="button" style="{{menuItemSoon}}">Mon profil <span style="font-size: 12px; font-weight: 700; color: #8A6A5A">(bientôt)</span></button>
      <button type="button" style="{{menuItemSoon}}">Notifications <span style="font-size: 12px; font-weight: 700; color: #8A6A5A">(bientôt)</span></button>
      <button type="button" style="{{menuItemLast}}">Se déconnecter</button>
    </section>
  </sc-if>

  <button type="button" style="margin-top: auto; min-height: 52px; border: 2px dashed #8A3A12; border-radius: 26px; background: rgba(255,244,232,0.4); color: #8A3A12; font-family: Nunito, sans-serif; font-size: 16px; font-weight: 800; cursor: pointer">+ Créer une autre famille</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menu":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // [couleur franche, contour foncé, teinte de la carte] — mêmes couleurs que Logo.dc.html (la teinte de la carte est un peu plus soutenue que le fond du logo).
    const palette = {
      bleu: ['#2F5AA8', '#1E3A6E', '#D3DFF5'], jaune: ['#F2B33D', '#7A5200', '#FFEDB8'], vert: ['#5E9E68', '#2F5A36', '#D5ECD7'],
    };
    const row = (kind, title, sub) => {
      const base = 'display: flex; align-items: center; gap: 12px; box-sizing: border-box; width: 100%; padding: 11px 14px 11px 12px; border: none; border-radius: 18px; cursor: pointer; font-family: Nunito, sans-serif; ';
      const styles = {
        action: base + 'background: #8A3A12; color: #FFFFFF; box-shadow: 0 4px 0 #5E260B',
        wait: base + 'background: #5B2333; color: #FFFFFF; box-shadow: 0 4px 0 #3D1622',
        alert: base + 'padding: 9px 14px 9px 10px; background: #FDE3D3; color: #A33A2A; box-shadow: inset 0 0 0 2px rgba(163,58,42,0.25)',
      };
      return {
        isAction: kind === 'action', isWait: kind === 'wait', isAlert: kind === 'alert',
        arrow: kind !== 'wait',
        title, sub, style: styles[kind],
        titleStyle: 'font-size: ' + (kind === 'alert' ? 15 : 17) + 'px; font-weight: 800; line-height: 1.2',
        subStyle: 'font-size: 13px; font-weight: 700; color: ' + (kind === 'action' ? '#FFE3CF' : kind === 'wait' ? '#FFD9C2' : '#A33A2A') + (sub ? '' : '; display: none'),
      };
    };
    const card = (couleur) => {
      const [main, dark, tint] = palette[couleur];
      return { dark, card: 'display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; border-radius: 28px; background: ' + tint + '; border: 3px solid ' + main + '; box-shadow: 0 6px 0 ' + dark + '55' };
    };
    const families = [
      Object.assign(card('bleu'), {
        name: 'Famille Chardaire', animal: 'vache', couleur: 'bleu', lettres: 'CH', last: false, openLabel: 'Ouvrir l’accueil de la famille Chardaire',
        rows: [row('action', 'Une question t’attend', 'Avant dimanche 29 novembre'), row('alert', 'Plus que 3 questions en réserve', 'Ajoute des souvenirs')],
      }),
      Object.assign(card('jaune'), {
        name: 'Famille Delatour', animal: 'lezard', couleur: 'jaune', lettres: 'DE', last: false, openLabel: 'Ouvrir l’accueil de la famille Delatour',
        rows: [row('action', 'La révélation est là', 'Qui a trouvé ? Découvre la réponse')],
      }),
      Object.assign(card('vert'), {
        name: 'Famille Morel', animal: 'chien', couleur: 'vert', lettres: 'MO', last: false, openLabel: 'Ouvrir l’accueil de la famille Morel',
        rows: [row('wait', 'Réponse envoyée', 'Révélation dimanche 29 novembre')],
      }),
    ];
    const item = 'display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 18px; border: none; border-bottom: 2px solid #F0E0CC; background: transparent; color: #3B1F14; font-family: Nunito, sans-serif; font-size: 16px; font-weight: 800; text-align: left; cursor: pointer';
    return {
      families,
      menuOpen: this.props.menu === true || this.props.menu === 'true',
      menuItem: item,
      menuItemSoon: item + '; color: #8A6A5A',
      menuItemLast: item + '; border-bottom: none; color: #A33A2A',
    };
  }
}
</script>
</body>
</html>
