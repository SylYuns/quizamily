<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion – piste C, la famille en ronds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<!-- Piste C « La famille en ronds » : un petit arbre de ronds colorés (ceux de l'appli) flotte en haut ; la connexion est un panneau qui monte du bas, comme le récapitulatif de l'arbre. -->
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #FFC98A 0%, #FFA36B 46%, #F48A86 100%); font-family: Nunito, system-ui, sans-serif; color: #3B1F14; overflow: hidden">

  <svg width="390" height="430" viewBox="0 0 390 430" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
      <path d="{{l}}" fill="none" stroke="rgba(138,58,18,0.35)" stroke-width="3" stroke-linecap="round"></path>
    </sc-for>
  </svg>
  <sc-for list="{{ronds}}" as="r" hint-placeholder-count="9">
    <span style="{{r.style}}">{{r.letter}}
      <sc-if value="{{r.star}}" hint-placeholder-val="{{ false }}">
        <span style="position: absolute; right: -4px; bottom: -4px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #FFFFFF; background: #8A3A12; color: #FFD66B; box-sizing: border-box"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"></path></svg></span>
      </sc-if>
    </span>
  </sc-for>

  <div style="position: absolute; left: 0; right: 0; top: 372px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <h1 style="margin: 0; font-family: Fredoka, Nunito, sans-serif; font-weight: 700; font-size: 44px; line-height: 1"><span style="color: #8A3A12">Quiz</span>amily</h1>
    <p style="margin: 0; font-size: 17px; font-weight: 700; color: #5E2A12">Le quiz de ta famille, une question par semaine.</p>
  </div>

  <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
    <section style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; padding: 14px 24px 32px; border-radius: 30px 30px 0 0; background: #FFF4E8; box-shadow: 0 -8px 30px rgba(59,31,20,0.18)">
      <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #E6D2B8"></span>
      <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 22px">Bienvenue !</span>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 800; color: #6E4A3A">Ton adresse e-mail
        <input type="email" placeholder="prenom@exemple.fr" style="box-sizing: border-box; height: 52px; padding: 0 16px; border: 2px solid #EAD9BD; border-radius: 16px; background: #FFFFFF; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 700; color: #3B1F14">
      </label>
      <button type="button" style="min-height: 54px; border: none; border-radius: 27px; background: #8A3A12; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 5px 0 #5E260B">Recevoir mon lien</button>
      <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 700; color: #6E4A3A">Sans mot de passe : un lien par e-mail suffit.</p>
    </section>
  </sc-if>

  <sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
    <section style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 24px 32px; border-radius: 30px 30px 0 0; background: #5B2333; color: #FFFFFF; box-shadow: 0 -8px 30px rgba(59,31,20,0.25)">
      <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: rgba(255,217,194,0.4)"></span>
      <span style="display: flex; align-items: center; gap: 12px">
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; background: #FFD66B; color: #5B2333">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg>
        </span>
        <span style="font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.05">Regarde tes e-mails</span>
      </span>
      <span style="font-size: 16px; line-height: 1.4; color: #FFD9C2">Ton lien est parti vers <b style="color: #FFFFFF">sylvain@exemple.fr</b>. Touche-le depuis ce téléphone. Rien reçu ? Regarde dans les indésirables.</span>
      <span style="display: flex; gap: 10px">
        <button type="button" style="min-height: 46px; padding: 0 18px; border: 2px solid #FFD66B; border-radius: 23px; background: transparent; color: #FFD66B; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Renvoyer le lien</button>
        <button type="button" style="min-height: 46px; padding: 0 10px; border: none; background: transparent; color: #FFFFFF; font-family: Nunito, sans-serif; font-size: 15px; font-weight: 800; text-decoration: underline; cursor: pointer">Changer d’adresse</button>
      </span>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","default":"email","options":["email","envoye"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sent = this.props.etat === 'envoye';
    const colors = { jaune: ['#FFD66B', '#5A3A00'], menthe: ['#9FD3C7', '#134A40'], orange: ['#F7A06A', '#4A1E06'], lavande: ['#B9A3E3', '#2E1A5C'] };
    // [lettre, couleur, x du centre, y du centre, taille, étoile]
    const people = [
      ['M', 'jaune', 150, 96, 70, true], ['J', 'menthe', 240, 96, 70, true],
      ['O', 'orange', 70, 214, 56, false], ['L', 'lavande', 195, 214, 56, false], ['H', 'jaune', 320, 214, 56, false],
      ['C', 'menthe', 40, 316, 42, false], ['T', 'lavande', 100, 316, 42, false], ['S', 'orange', 170, 316, 42, false], ['E', 'menthe', 222, 316, 42, false],
    ];
    const ronds = people.map(([letter, c, x, y, size, star]) => ({
      letter, star,
      style: 'position: absolute; left: ' + (x - size / 2) + 'px; top: ' + (y - size / 2) + 'px; display: flex; align-items: center; justify-content: center; width: ' + size + 'px; height: ' + size + 'px; box-sizing: border-box; border: 3px solid #FFFFFF; border-radius: 50%; background: ' + colors[c][0] + '; color: ' + colors[c][1] + '; font-family: Fredoka, sans-serif; font-weight: 600; font-size: ' + Math.round(size * 0.42) + 'px; box-shadow: 0 3px 0 rgba(138,58,18,0.2)' + (sent ? '; opacity: 0.55' : ''),
    }));
    return {
      isForm: !sent,
      isSent: sent,
      ronds,
      lines: [
        'M150 96 H240', 'M195 96 V150 M70 150 H320 M70 150 V186 M195 150 V186 M320 150 V186',
        'M70 242 V280 M40 280 H100 M40 280 V295 M100 280 V295',
        'M195 242 V280 M170 280 H222 M170 280 V295 M222 280 V295',
      ],
    };
  }
}
</script>
</body>
</html>
